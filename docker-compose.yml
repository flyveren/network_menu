version: "3.9"

services:
  navigation:
    build: .
    init: true
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
      - ./app/certs:/usr/src/app/certs
    environment:
      - NODE_ENV=production
      - PORT=8081
      - ENABLE_SELF_SIGNED_CERT=true
      - SELF_SIGNED_CERT_SUBJECT=/CN=localhost
      - SELF_SIGNED_CERT_DAYS=365
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - navigation_net

networks:
  navigation_net:
    driver: bridge

